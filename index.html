<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillGap - Job Skill Gap Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎯 SkillGap</h1>

        <p>Find the skills you need for your dream job.</p>

        <label for="role">Select Your Target Role:</label>

        <select id="role">
            <option value="">-- Select Role --</option>
            <option value="frontend">Frontend Developer</option>
            <option value="data">Data Analyst</option>
            <option value="backend">Backend Developer</option>
        </select>

        <h2>Your Current Skills</h2>

        <label>
            <input type="checkbox" value="html">
            HTML
        </label>

        <label>
            <input type="checkbox" value="css">
            CSS
        </label>

        <label>
            <input type="checkbox" value="javascript">
            JavaScript
        </label>

        <label>
            <input type="checkbox" value="git">
            Git / GitHub
        </label>

        <button id="analyzeBtn">
            Analyze Skill Gap
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
